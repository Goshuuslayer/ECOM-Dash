<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SweetBalance</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="decor decor-one"></div>
    <div class="decor decor-two"></div>

    <nav class="navbar">
      <a href="index.html" class="logo">Sweet<span>Balance</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" class="nav-btn">Log In</a>
      </div>
    </nav>

    <main class="auth-container">
      <section class="auth-card">
        <div class="auth-header">
          <p class="eyebrow">WELCOME</p>
          <h1>Create your <span>account</span></h1>
          <p>Join SweetBalance and keep your information in one place.</p>
        </div>

        <form id="signupForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
            </div>
          </div>

          <label class="check-row">
            <input type="checkbox" id="terms" required>
            <span>I agree to the terms and conditions.</span>
          </label>

          <button type="submit" class="btn-primary">Create Account</button>

          <p class="switch-text">
            Already have an account?
            <a href="login.html">Log in</a>
          </p>
        </form>
      </section>
    </main>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      window.location.href = "https://admin-dashboard-23776.web.app/Home.html?";
    });
  </script>
</body>
</html>
